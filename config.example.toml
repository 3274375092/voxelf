# voxelf 配置文件。复制本文件为 config.toml 并填入 DEEPSEEK_API_KEY,
# 或者直接设置环境变量 DEEPSEEK_API_KEY。

[deepseek]
# 留空则读取环境变量 DEEPSEEK_API_KEY
api_key = ""
base_url = "https://api.deepseek.com"
model = "deepseek-chat"
system_prompt = """你是一个住在像素世界里的可爱小精灵伙伴,名字叫 Vox。用简短、口语化的中文回复,每次不超过 3 句话。语气活泼、温暖、有点俏皮。回复是要被语音合成朗读出来的,不要使用列表、markdown 符号或表情符号。句子之间用句号或感叹号分隔,方便语音流式播放。"""

[brain]
# deepseek | agent(全走 agent CLI,无降级) | hybrid(推荐: 有 agent CLI 全走 agent,没有自动降级 DeepSeek)
kind = "deepseek"

[brain.agent]
# agent 可执行文件。优先用这里的命令;jcode 协议下找不到时自动回退到
# 与 voxelf.exe 同目录的便携版 jcode.exe(随分发包附带,免安装)
command = "jcode"
workdir = "."
# 是否启用 agent(false = 即使装了对应 CLI 也不用)
enabled = true
# 适配协议: jcode(默认,常驻 repl,流式增量 + 工具动画 + 跨轮记忆)
#           one-shot(每轮新起进程,stdout 全文为最终回复,无流式)
protocol = "jcode"
# one-shot 协议的启动参数模板,{prompt} 会被替换为用户输入;空 = ["{prompt}"]。
# 接 DeepSeek Harness 示例(npm i -g @deepseek-ai/dsh,首次跑会自动初始化 headless profile):
# command = "dsh"
# protocol = "one-shot"
# args = ["--profile", "headless", "{prompt}"]
args = []
# 传给 `jcode repl -p` 的 provider; 留空用 jcode 自动探测(仅 jcode 协议)
provider = "deepseek"
# 工具白名单(逗号分隔 read,write,edit,bash,websearch,webfetch...);
# 空 = 内置 minimal 只读工具集(仅 jcode 协议)
tools = ""
# 单轮 agent 响应超时(秒),超时后杀掉进程并报错。
# one-shot 协议每轮含 CLI 冷启动 + 模型调用,建议 ≥ 300
timeout_secs = 120

[models]
# 纯中文: assets/models/asr-zh(zipformer2, 默认, 中文准确率最高)
# 中英双语(可选): assets/models/asr-zh-en-2025(zipformer2, 2025-02-10,
#   英文词/短语识别更好,但中文略有退化; 需先跑下载脚本拉取)
asr_dir = "assets/models/asr-zh"
vad_model = "assets/models/vad/silero_vad.onnx"
# ASR 模型架构: zipformer2(2024+ 中文/双语模型) | zipformer(2023 老双语模型)
asr_model_type = "zipformer2"
# vits(默认,快): 目录 assets/models/vits-zh, voice 为 speaker id 数字
# kokoro(音质好): 目录 assets/models/kokoro, voice 为 xiaobei/xiaoni/xiaoxiao/xiaoyi
tts_dir = "assets/models/vits-zh"
tts_model_file = "model.onnx"
tts_voice = "0"
tts_kind = "vits"
asr_threads = 2
tts_threads = 4
# VAD 语音/静音判定阈值(0-1),越低越不容易吞句尾
vad_threshold = 0.3
# VAD 判定"一句话说完"所需的尾部静音秒数,越大越不易截断句尾
vad_min_silence = 0.5
# VAD 判定"开始说话"所需的最小语音时长(秒)
vad_min_speech = 0.25
# VAD 允许的单段最长语音(秒)
vad_max_speech = 20.0
# 段弹出后追加的尾部音频时长(秒),补偿渐弱尾音被 VAD 截断
vad_tail_pad = 0.6
