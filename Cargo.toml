[package]
name = "voxelf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.16.0"
eframe = { version = "0.36.1", default-features = false, features = ["glow", "default_fonts", "accesskit", "x11", "wayland"] }
flume = "0.12.0"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rodio = "0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sherpa-onnx = "1.13.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
fontdue = "0.9.4"
