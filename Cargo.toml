[package]
name = "voxelf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
cpal = "0.18.1"
flume = "0.12.0"
futures-util = "0.3.33"
image = "0.25.10"
macroquad = "0.4.16"
pollster = "1.0.1"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
rodio = "0.22.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sherpa-onnx = "1.13.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "fs"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
